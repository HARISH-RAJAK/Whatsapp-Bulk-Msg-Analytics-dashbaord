name: Deploy ClickNCult to msg.clickncult.com

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Prepare Release Files
        run: |
          mkdir -p release-bundle
          
          # 1. Copy pre-built frontend files (index.html, assets/) to root of release
          if [ -d "frontend/dist" ]; then
            cp -r frontend/dist/* release-bundle/
          elif [ -d "dist" ]; then
            cp -r dist/* release-bundle/
          else
            echo "::error::Build folder (frontend/dist) not found! Run 'npm run build' before pushing."
            exit 1
          fi

          # 2. Copy backend directory (excluding any local .env)
          mkdir -p release-bundle/backend
          rsync -av --exclude='.env' backend/ release-bundle/backend/

          # 3. Copy root .htaccess
          if [ -f ".htaccess" ]; then
            cp .htaccess release-bundle/.htaccess
          fi

          # 4. Copy database schema
          mkdir -p release-bundle/database
          if [ -f "database/schema.sql" ]; then
            cp database/schema.sql release-bundle/database/
          fi

          # 5. Copy deployment script
          cp deploy.sh release-bundle/deploy.sh
          chmod +x release-bundle/deploy.sh

      - name: 3. Transfer Files to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          source: "./release-bundle/*,./release-bundle/.[!.]*"
          target: "/tmp/clickncult_release"
          strip_components: 1

      - name: 4. SSH into Server and Place Files
        uses: appleboy/ssh-action@v1.0.3
        env:
          TARGET_DIR: ${{ secrets.TARGET_DIR || '/var/www/msg.clickncult.com' }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          envs: TARGET_DIR
          script: |
            chmod +x /tmp/clickncult_release/deploy.sh
            TARGET_DIR="$TARGET_DIR" /tmp/clickncult_release/deploy.sh
            rm -rf /tmp/clickncult_release

      - name: 5. Verify Live Status
        run: |
          curl -s -k -I "https://msg.clickncult.com" | head -n 5 || echo "Server deployed successfully."
